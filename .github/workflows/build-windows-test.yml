name: Build SmsHks Windows test version

on:
  push:
    branches:
      - feature/sms-modernization-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android companion APK
        shell: pwsh
        run: |
          gradle -p android_app :app:assembleDebug --no-daemon
          New-Item -ItemType Directory -Force -Path bundle\android | Out-Null
          Copy-Item android_app\app\build\outputs\apk\debug\app-debug.apk bundle\android\SmsHks-Phone.apk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest fastapi uvicorn pyserial pillow

      - name: Build SmsHks Windows icon
        run: python tools/build_smshks_icon.py

      - name: Check Python syntax
        run: python -m compileall -q src phone_server tests main.py tools

      - name: Run tests
        run: python -m pytest tests -q

      - name: Prepare bundled ADB
        shell: pwsh
        run: |
          $adbDir = Join-Path $env:ANDROID_HOME "platform-tools"
          if (-not (Test-Path (Join-Path $adbDir "adb.exe"))) {
            throw "adb.exe was not found in Android SDK platform-tools"
          }
          New-Item -ItemType Directory -Force -Path bundle\adb | Out-Null
          Copy-Item (Join-Path $adbDir "adb.exe") bundle\adb\adb.exe
          Copy-Item (Join-Path $adbDir "AdbWinApi.dll") bundle\adb\AdbWinApi.dll
          Copy-Item (Join-Path $adbDir "AdbWinUsbApi.dll") bundle\adb\AdbWinUsbApi.dll

      - name: Build portable Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --noupx `
            --name "SmsHks-Portable" `
            --icon "src/presentation/resources/smshks.ico" `
            --add-data "src/presentation/resources;src/presentation/resources" `
            --add-data "bundle/android/SmsHks-Phone.apk;android" `
            --add-binary "bundle/adb/adb.exe;adb" `
            --add-binary "bundle/adb/AdbWinApi.dll;adb" `
            --add-binary "bundle/adb/AdbWinUsbApi.dll;adb" `
            main.py

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SmsHks-Portable\*" -DestinationPath "dist\SmsHks-Portable.zip" -Force

      - name: Upload portable Windows and Android test files
        uses: actions/upload-artifact@v4
        with:
          name: SmsHks-Windows-Portable
          path: |
            dist/SmsHks-Portable.zip
            bundle/android/SmsHks-Phone.apk
          if-no-files-found: error
          retention-days: 14
