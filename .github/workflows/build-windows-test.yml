name: Build Windows test version

on:
  push:
    branches:
      - feature/sms-modernization-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest fastapi uvicorn pyserial

      - name: Check Python syntax
        run: python -m compileall -q src phone_server tests main.py

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "SMSCaster-Test" `
            --add-data "src/presentation/resources;src/presentation/resources" `
            main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SMSCaster-Windows-Test
          path: dist/SMSCaster-Test.exe
          if-no-files-found: error
          retention-days: 14
